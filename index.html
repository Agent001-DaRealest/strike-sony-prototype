<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>STRIKE:SONY — Arcade Sweet Zone</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='2' fill='%230b0f1a'/%3E%3Ccircle cx='8' cy='8' r='4' fill='%2300e5a8'/%3E%3C/svg%3E" />
<style>
  :root {
    --bg: #0b0f1a;
    --cabinet: #12182a;
    --panel: #1a2238;
    --ink: #e8eefc;
    --muted: #8b97b8;
    --neon: #00e5a8;
    --neon-dim: #00e5a855;
    --gold: #ffc857;
    --hot: #ff4d6d;
    --blue: #4cc9f0;
    --extrinsic: #ffc857;
    --intrinsic: #00e5a8;
    --zone: #7b61ff;
    --zone-glow: #7b61ff88;
    --paper-dot: #1e2740;
    --thumb: 56px;
    --font: "Segoe UI", system-ui, -apple-system, sans-serif;
    --mono: "SF Mono", "Consolas", ui-monospace, monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%;
    background: #05070e;
    color: var(--ink);
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.35;
    user-select: none;
    touch-action: manipulation;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100dvh;
    padding: 8px;
  }
  .cabinet {
    width: min(100%, 420px);
    min-height: min(92dvh, 760px);
    background:
      radial-gradient(circle, var(--paper-dot) 0.8px, transparent 0.9px) 0 0 / 16px 16px,
      linear-gradient(180deg, #151c30 0%, var(--cabinet) 40%, #0e1424 100%);
    border-radius: 18px;
    border: 3px solid #2a3558;
    box-shadow:
      0 0 0 2px #0a0e18,
      0 0 40px #00e5a822,
      0 18px 48px #000000aa,
      inset 0 1px 0 #3a4670;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }
  .marquee {
    padding: 12px 16px 8px;
    text-align: center;
    border-bottom: 1px solid #2a3558;
    background: linear-gradient(180deg, #1c2540, transparent);
  }
  .marquee h1 {
    margin: 0;
    font-size: 13px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--neon);
    text-shadow: 0 0 12px var(--neon-dim);
  }
  .marquee .sub {
    margin-top: 4px;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.06em;
  }
  .stage {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 14px 16px 12px;
    gap: 12px;
    min-height: 0;
  }
  .panel {
    background: var(--panel);
    border: 1px solid #2f3c62;
    border-radius: 14px;
    padding: 14px;
    box-shadow: inset 0 1px 0 #3a4a78;
  }
  .story-big {
    font-size: 22px;
    font-weight: 800;
    line-height: 1.25;
    letter-spacing: -0.02em;
  }
  .story-mid {
    margin-top: 8px;
    color: var(--muted);
    font-size: 14px;
  }
  .ticker {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    margin-top: 14px;
    padding: 12px;
    border-radius: 12px;
    background: #0d1324;
    border: 1px solid #2a3558;
  }
  .ticker .sym {
    font-family: var(--mono);
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--blue);
  }
  .ticker .px {
    font-family: var(--mono);
    font-size: 28px;
    font-weight: 800;
  }
  .ticker .chg {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--hot);
  }
  .btn {
    appearance: none;
    border: none;
    border-radius: 14px;
    min-height: var(--thumb);
    padding: 14px 18px;
    font: inherit;
    font-weight: 800;
    letter-spacing: 0.04em;
    cursor: pointer;
    transition: transform 0.08s ease, filter 0.12s ease, box-shadow 0.12s ease;
  }
  .btn:active { transform: scale(0.97); }
  .btn-neon {
    background: linear-gradient(180deg, #1affc0, var(--neon));
    color: #041018;
    box-shadow: 0 0 22px var(--neon-dim), 0 4px 0 #009e74;
  }
  .btn-ghost {
    background: #1a2238;
    color: var(--ink);
    border: 1px solid #3a4a78;
  }
  .btn-hot {
    background: linear-gradient(180deg, #ff7a90, var(--hot));
    color: #1a0508;
    box-shadow: 0 0 24px #ff4d6d66, 0 5px 0 #b01f3a;
    font-size: 22px;
    letter-spacing: 0.18em;
  }
  .btn-row { display: flex; gap: 10px; margin-top: auto; }
  .btn-row .btn { flex: 1; }
  .hint {
    font-size: 12px;
    color: var(--muted);
    text-align: center;
  }
  .label {
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }

  /* WHERE */
  .price-rail {
    position: relative;
    height: 64px;
    margin: 8px 0 4px;
    touch-action: none;
  }
  .price-track {
    position: absolute;
    left: 0; right: 0; top: 28px;
    height: 10px;
    border-radius: 999px;
    background: #0d1324;
    border: 1px solid #2f3c62;
    overflow: hidden;
  }
  .price-fill {
    height: 100%;
    width: 40%;
    background: linear-gradient(90deg, var(--blue), var(--neon));
    border-radius: 999px;
  }
  .price-now {
    position: absolute;
    top: 18px;
    width: 3px;
    height: 30px;
    background: var(--hot);
    border-radius: 2px;
    transform: translateX(-50%);
  }
  .price-thumb {
    position: absolute;
    top: 8px;
    width: 48px;
    height: 48px;
    margin-left: -24px;
    border-radius: 50%;
    background: var(--gold);
    border: 3px solid #fff3c4;
    box-shadow: 0 0 18px #ffc85788, 0 4px 0 #b8860b;
    display: grid;
    place-items: center;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 800;
    color: #2a1a00;
    cursor: grab;
    z-index: 2;
  }
  .price-readout {
    text-align: center;
    font-family: var(--mono);
    font-size: 36px;
    font-weight: 800;
    color: var(--gold);
    text-shadow: 0 0 18px #ffc85755;
  }
  .price-meta {
    display: flex;
    justify-content: space-between;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
  }

  /* WHEN */
  .tenor-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .tenor {
    min-height: 72px;
    border-radius: 14px;
    border: 2px solid #2f3c62;
    background: #0d1324;
    color: var(--ink);
    font: inherit;
    font-weight: 800;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }
  .tenor .d { font-size: 22px; font-family: var(--mono); }
  .tenor .t { font-size: 11px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
  .tenor.on {
    border-color: var(--neon);
    box-shadow: 0 0 18px var(--neon-dim);
    background: #102a28;
  }

  /* PICK */
  .opt-list { display: flex; flex-direction: column; gap: 10px; }
  .opt-card {
    text-align: left;
    border-radius: 14px;
    border: 2px solid #2f3c62;
    background: #0d1324;
    color: var(--ink);
    padding: 12px 14px;
    cursor: pointer;
    font: inherit;
    min-height: 88px;
  }
  .opt-card.on {
    border-color: var(--neon);
    box-shadow: 0 0 20px var(--neon-dim);
  }
  .opt-card .name {
    font-weight: 800;
    font-size: 15px;
    letter-spacing: 0.02em;
  }
  .opt-card .spec {
    margin-top: 6px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--blue);
  }
  .opt-card .why {
    margin-top: 6px;
    font-size: 12px;
    color: var(--muted);
  }
  .opt-card .lev {
    display: inline-block;
    margin-top: 8px;
    padding: 3px 8px;
    border-radius: 999px;
    background: #1a2238;
    border: 1px solid #3a4a78;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--gold);
  }

  /* ARCADE */
  .arcade-hud {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .hud-cell {
    background: #0d1324;
    border: 1px solid #2f3c62;
    border-radius: 12px;
    padding: 10px 12px;
  }
  .hud-cell .k {
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .hud-cell .v {
    font-family: var(--mono);
    font-size: 18px;
    font-weight: 800;
    margin-top: 2px;
  }
  .meter-wrap { margin-top: 2px; }
  .meter-labels {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    margin-bottom: 6px;
  }
  .meter-labels .ex { color: var(--extrinsic); font-weight: 700; }
  .meter-labels .in { color: var(--intrinsic); font-weight: 700; }
  .stack-meter {
    height: 28px;
    border-radius: 8px;
    background: #0d1324;
    border: 1px solid #2f3c62;
    display: flex;
    overflow: hidden;
  }
  .stack-ex {
    background: linear-gradient(180deg, #ffe29a, var(--extrinsic));
    transition: width 0.08s linear;
  }
  .stack-in {
    background: linear-gradient(180deg, #6dffd0, var(--intrinsic));
    transition: width 0.08s linear;
  }
  .track-box {
    position: relative;
    height: 160px;
    margin: 4px 0;
    background: #0a1020;
    border-radius: 14px;
    border: 1px solid #2f3c62;
    overflow: hidden;
  }
  .track-box canvas { width: 100%; height: 100%; display: block; }
  .zone-chip {
    position: absolute;
    top: 8px;
    left: 50%;
    transform: translateX(-50%);
    padding: 4px 10px;
    border-radius: 999px;
    background: #7b61ff33;
    border: 1px solid var(--zone);
    color: #cbbfff;
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-weight: 800;
    pointer-events: none;
  }
  .zone-chip.hot {
    background: #00e5a833;
    border-color: var(--neon);
    color: var(--neon);
    box-shadow: 0 0 16px var(--neon-dim);
  }
  .sell-wrap { margin-top: 4px; }
  .sell-wrap .btn { width: 100%; min-height: 68px; }
  .coach {
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    min-height: 36px;
  }
  .coach.alert { color: var(--gold); font-weight: 700; }

  /* RESULT */
  .stamp {
    text-align: center;
    padding: 18px 10px;
  }
  .stamp .grade {
    font-size: 34px;
    font-weight: 900;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .stamp .grade.win { color: var(--neon); text-shadow: 0 0 20px var(--neon-dim); }
  .stamp .grade.ok { color: var(--gold); }
  .stamp .grade.lose { color: var(--hot); }
  .stamp .grade.rare { color: #ff66cc; text-shadow: 0 0 24px #ff66cc88; }
  .stamp .detail {
    margin-top: 8px;
    color: var(--muted);
    font-size: 14px;
  }
  .lesson {
    margin-top: 10px;
    padding: 12px;
    border-radius: 12px;
    background: #0d1324;
    border: 1px solid #2f3c62;
    font-size: 13px;
    line-height: 1.45;
  }
  .lesson strong { color: var(--gold); }
  .iv-split {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 10px;
  }
  .iv-split .cell {
    padding: 10px;
    border-radius: 10px;
    background: #0d1324;
    border: 1px solid #2f3c62;
    text-align: center;
  }
  .iv-split .cell .n { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; }
  .iv-split .cell .x { font-family: var(--mono); font-size: 20px; font-weight: 800; margin-top: 4px; }

  .hidden { display: none !important; }
  .flex-grow { flex: 1; }
  .foot {
    padding: 8px 16px 12px;
    text-align: center;
    font-size: 10px;
    color: #5a6688;
    letter-spacing: 0.08em;
  }
</style>
</head>
<body>
<div class="cabinet" id="app">
  <div class="marquee">
    <h1>STRIKE · SONY</h1>
    <div class="sub" id="marqueeSub">Arcade · Sweet-Zone Sell</div>
  </div>
  <div class="stage" id="stage"></div>
  <div class="foot">YOUR FAVORITE · TIMING IS THE SKILL</div>
</div>
<script>
(function () {
  'use strict';

  // ─── Market defaults (SONY under the hood) ───
  const SPOT0 = 88.40;          // "now" — down from recent
  const REF = 96.20;            // recent reference high-ish
  const UNDER = 'SONY';
  const MIN_TARGET = 90;
  const MAX_TARGET = 120;

  // ─── Seeded RNG ───
  function mulberry32(a) {
    return function () {
      let t = (a += 0x6d2b79f5);
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function daySeed() {
    const d = new Date();
    return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
  }

  // ─── ~20 typical outcome paths ───
  // Each path: id, tier ('common'|'uncommon'|'rare'), weight, label, builder(t01, ctx) → spot
  // ctx: { spot0, strike, target, days, tenorDays }
  const OUTCOMES = [
    { id: 'flat-decay', tier: 'common', weight: 14, label: 'Flat decay killer',
      build: (t, c) => c.spot0 + Math.sin(t * 8) * 0.35 - t * 0.4 },
    { id: 'grind', tier: 'common', weight: 12, label: 'Slow grind',
      build: (t, c) => c.spot0 + (c.target - c.spot0) * Math.pow(t, 1.15) * 0.72 },
    { id: 'touch', tier: 'common', weight: 11, label: 'Light touch',
      build: (t, c) => {
        const peak = 0.42;
        const amp = (c.target - c.spot0) * 0.55;
        if (t < peak) return c.spot0 + amp * (t / peak);
        return c.spot0 + amp * (1 - (t - peak) / (1 - peak) * 0.85);
      }},
    { id: 'wash', tier: 'common', weight: 10, label: 'Wash / nowhere',
      build: (t, c) => c.spot0 + Math.sin(t * 14) * 0.9 + Math.cos(t * 5) * 0.4 },
    { id: 'fade', tier: 'common', weight: 9, label: 'Early fade',
      build: (t, c) => {
        const up = (c.target - c.spot0) * 0.4;
        if (t < 0.25) return c.spot0 + up * (t / 0.25);
        return c.spot0 + up - (up + 2) * ((t - 0.25) / 0.75);
      }},
    { id: 'overshoot-2', tier: 'uncommon', weight: 7, label: 'Overshoot ×2',
      build: (t, c) => {
        const base = c.spot0 + (c.target - c.spot0) * 0.9;
        const bump = Math.max(0, Math.sin(t * Math.PI * 2)) * (c.target - c.spot0) * 0.35;
        return base * t + c.spot0 * (1 - t) + bump + (c.target - c.spot0) * t * 0.5;
      }},
    { id: 'late-rally', tier: 'uncommon', weight: 6, label: 'Late rally',
      build: (t, c) => {
        if (t < 0.55) return c.spot0 + Math.sin(t * 10) * 0.5 - t * 0.3;
        return c.spot0 + (c.target - c.spot0) * Math.pow((t - 0.55) / 0.45, 0.9);
      }},
    { id: 'spike-die', tier: 'uncommon', weight: 6, label: 'Spike then die',
      build: (t, c) => {
        if (t < 0.18) return c.spot0 + (c.target - c.spot0) * 1.1 * (t / 0.18);
        if (t < 0.35) return c.target + (c.target - c.spot0) * 0.15;
        return c.target + (c.target - c.spot0) * 0.15 - (c.target - c.spot0 + 4) * ((t - 0.35) / 0.65);
      }},
    { id: 'slow-bleed', tier: 'common', weight: 8, label: 'Slow bleed',
      build: (t, c) => c.spot0 - t * 3.2 - Math.sin(t * 6) * 0.3 },
    { id: 'meander-up', tier: 'common', weight: 8, label: 'Meander up',
      build: (t, c) => c.spot0 + (c.target - c.spot0) * 0.5 * t + Math.sin(t * 18) * 1.2 },
    { id: 'false-break', tier: 'uncommon', weight: 5, label: 'False break',
      build: (t, c) => {
        const mid = c.spot0 + (c.strike - c.spot0) * 1.05;
        if (t < 0.4) return c.spot0 + (mid - c.spot0) * (t / 0.4);
        if (t < 0.55) return mid - (mid - c.spot0) * 0.6 * ((t - 0.4) / 0.15);
        return mid - (mid - c.spot0) * 0.6 - t * 1.5;
      }},
    { id: 'target-kiss', tier: 'uncommon', weight: 5, label: 'Target kiss',
      build: (t, c) => {
        const peak = 0.62;
        const amp = c.target - c.spot0;
        if (t < peak) return c.spot0 + amp * Math.pow(t / peak, 0.85);
        return c.target - amp * 0.25 * ((t - peak) / (1 - peak));
      }},
    { id: 'chop-flat', tier: 'common', weight: 7, label: 'Chop flat',
      build: (t, c) => c.spot0 + Math.sin(t * 22) * 1.1 + Math.sin(t * 7) * 0.5 },
    { id: 'steady-climb', tier: 'uncommon', weight: 5, label: 'Steady climb',
      build: (t, c) => c.spot0 + (c.target - c.spot0) * 0.95 * t },
    { id: 'dip-recover', tier: 'common', weight: 6, label: 'Dip then recover',
      build: (t, c) => {
        if (t < 0.3) return c.spot0 - 2.5 * (t / 0.3);
        return c.spot0 - 2.5 + (c.target - c.spot0 + 2.5) * 0.7 * ((t - 0.3) / 0.7);
      }},
    { id: 'overshoot-soft', tier: 'uncommon', weight: 4, label: 'Soft overshoot',
      build: (t, c) => c.spot0 + (c.target - c.spot0) * 1.25 * Math.sin(t * Math.PI * 0.5) },
    { id: 'intrinsic-takeover', tier: 'uncommon', weight: 4, label: 'Intrinsic takeover',
      build: (t, c) => {
        // Crosses strike hard mid-run then stalls — extrinsic dies as ITM
        const cross = 0.35;
        if (t < cross) return c.spot0 + (c.strike + 1.5 - c.spot0) * (t / cross);
        return c.strike + 1.5 + Math.sin((t - cross) * 10) * 0.4;
      }},
    { id: 'crush', tier: 'rare', weight: 1.2, label: 'CRUSH',
      build: (t, c) => c.spot0 + (c.target - c.spot0) * 2.4 * Math.pow(t, 0.7) },
    { id: 'mega-crush', tier: 'rare', weight: 0.5, label: 'MEGA CRUSH',
      build: (t, c) => c.spot0 + (c.target - c.spot0) * 3.2 * Math.pow(t, 0.55) },
    { id: 'ghost-run', tier: 'rare', weight: 0.8, label: 'Ghost run',
      build: (t, c) => {
        // Looks dead then rare late crush
        if (t < 0.7) return c.spot0 + Math.sin(t * 12) * 0.4 - t * 0.2;
        return c.spot0 + (c.target - c.spot0) * 2.0 * Math.pow((t - 0.7) / 0.3, 0.6);
      }},
  ];

  // ─── Big-reward (crush) schedule — Adam ───
  // 1) Guaranteed early taste on first arcade run
  // 2) Then ~every 5th run
  // 3) Gaps stretch: 5 → 8 → 12 → 18 → 27 → 40 → 60 (cap)
  // 4) Never unobtainable: deterministic due OR residual 2% mid-gap
  const LS_RUN = 'strikeSonyArcadeRuns';
  const LS_CRUSH = 'strikeSonyCrushHits';
  const LS_SINCE = 'strikeSonyRunsSinceCrush';
  const GAP_SEQ = [1, 5, 8, 12, 18, 27, 40, 60]; // index = crushHits already earned
  const RESIDUAL_RARE = 0.02; // mid-gap non-zero chance; still eventually due

  function lsGet(k, d) {
    try {
      const v = localStorage.getItem(k);
      if (v == null || v === '') return d;
      const n = Number(v);
      return Number.isFinite(n) ? n : d;
    } catch (_) { return d; }
  }
  function lsSet(k, v) {
    try { localStorage.setItem(k, String(v)); } catch (_) {}
  }

  function gapForCrushHits(hits) {
    if (hits < GAP_SEQ.length) return GAP_SEQ[hits];
    // Beyond table: keep stretching +4 each, floor at last
    return GAP_SEQ[GAP_SEQ.length - 1] + (hits - (GAP_SEQ.length - 1)) * 8;
  }

  function getCrushSchedule() {
    const runs = lsGet(LS_RUN, 0);
    const hits = lsGet(LS_CRUSH, 0);
    const since = lsGet(LS_SINCE, 0);
    const gap = gapForCrushHits(hits);
    const due = since >= gap; // before increment: "about to start" uses since+1
    return { runs, hits, since, gap, nextGap: gap, residual: RESIDUAL_RARE };
  }

  function resetCrushSchedule() {
    lsSet(LS_RUN, 0);
    lsSet(LS_CRUSH, 0);
    lsSet(LS_SINCE, 0);
  }

  /** Preview whether the NEXT run (after increment) should force rare. */
  function wouldForceRareOnNextRun(rng, opts) {
    opts = opts || {};
    const hits = lsGet(LS_CRUSH, 0);
    const since = lsGet(LS_SINCE, 0);
    const gap = gapForCrushHits(hits);
    const after = since + 1;
    if (after >= gap) return { force: true, reason: 'due', after, gap, hits };
    const residual = opts.residualOff ? 0 : RESIDUAL_RARE;
    if (residual > 0 && rng() < residual) return { force: true, reason: 'residual', after, gap, hits };
    return { force: false, reason: 'wait', after, gap, hits };
  }

  function weightedPick(list, rng) {
    const total = list.reduce((s, o) => s + o.weight, 0);
    let r = rng() * total;
    for (const o of list) {
      r -= o.weight;
      if (r <= 0) return o;
    }
    return list[0];
  }

  function pickRare(rng) {
    return weightedPick(OUTCOMES.filter((o) => o.tier === 'rare'), rng);
  }

  function pickNonRare(rng) {
    return weightedPick(OUTCOMES.filter((o) => o.tier !== 'rare'), rng);
  }

  /**
   * Start-of-run picker: increments counters, returns outcome.
   * smokeForceOutcome bypasses schedule (still increments run for realism unless skipCount).
   */
  function pickOutcome(rng, opts) {
    opts = opts || {};
    const skipCount = !!opts.skipCount;
    let forceRare = false;
    let reason = 'weighted';

    if (!skipCount) {
      const decision = wouldForceRareOnNextRun(rng, opts);
      // commit counters
      const runs = lsGet(LS_RUN, 0) + 1;
      lsSet(LS_RUN, runs);
      lsSet(LS_SINCE, decision.after);
      forceRare = decision.force;
      reason = decision.reason;
    }

    if (state.smokeForceOutcome) {
      const forced = OUTCOMES.find((o) => o.id === state.smokeForceOutcome);
      if (forced) {
        if (forced.tier === 'rare' && !skipCount) {
          lsSet(LS_CRUSH, lsGet(LS_CRUSH, 0) + 1);
          lsSet(LS_SINCE, 0);
        }
        return Object.assign({}, forced, { _scheduleReason: 'smoke-force' });
      }
    }

    let out;
    if (forceRare) {
      out = pickRare(rng);
      if (!skipCount) {
        lsSet(LS_CRUSH, lsGet(LS_CRUSH, 0) + 1);
        lsSet(LS_SINCE, 0);
      }
      return Object.assign({}, out, { _scheduleReason: reason });
    }
    out = pickNonRare(rng);
    return Object.assign({}, out, { _scheduleReason: reason });
  }

  /** Pure simulator for smoke — does not touch live arcade. */
  function simulateCrushSchedule(nRuns, seed, simOpts) {
    simOpts = simOpts || {};
    const residualOff = simOpts.residualOff !== false; // default ON for clean gap proof
    const rng = mulberry32(seed || 42);
    const prevForce = state.smokeForceOutcome;
    state.smokeForceOutcome = null;
    const snap = {
      runs: lsGet(LS_RUN, 0),
      hits: lsGet(LS_CRUSH, 0),
      since: lsGet(LS_SINCE, 0),
    };
    resetCrushSchedule();
    const log = [];
    for (let i = 0; i < nRuns; i++) {
      const before = getCrushSchedule();
      const o = pickOutcome(rng, { residualOff: residualOff });
      const after = getCrushSchedule();
      log.push({
        run: after.runs,
        id: o.id,
        tier: o.tier,
        reason: o._scheduleReason,
        gapBefore: before.gap,
        sinceBefore: before.since,
        hitsAfter: after.hits,
      });
    }
    lsSet(LS_RUN, snap.runs);
    lsSet(LS_CRUSH, snap.hits);
    lsSet(LS_SINCE, snap.since);
    state.smokeForceOutcome = prevForce;
    return log;
  }

  // ─── Option pricing (toy Black-ish) ───
  function clamp(x, a, b) { return Math.max(a, Math.min(b, x)); }
  function extrinsicAt(spot, strike, tLeft01, entryExtrinsic) {
    // Extrinsic melts with remaining time; also compresses when deep ITM
    const timeFactor = Math.pow(Math.max(0, tLeft01), 0.85);
    const moneyness = (spot - strike) / Math.max(1, strike);
    const deepITM = clamp(moneyness, 0, 0.25) / 0.25; // 0..1
    const compress = 1 - deepITM * 0.55;
    return Math.max(0, entryExtrinsic * timeFactor * compress);
  }
  function intrinsicAt(spot, strike) {
    return Math.max(0, spot - strike);
  }
  function optionValue(spot, strike, tLeft01, entryExtrinsic) {
    return intrinsicAt(spot, strike) + extrinsicAt(spot, strike, tLeft01, entryExtrinsic);
  }

  // ─── Build 3 structures from where + when ───
  function buildStructures(target, days) {
    const upside = target - SPOT0;
    // Aggressive: OTM, short tenor, high leverage
    const aggStrike = Math.round((SPOT0 + upside * 0.85) * 2) / 2;
    const aggDays = Math.max(7, Math.round(days * 0.55));
    // Balanced: near target, matching tenor
    const balStrike = Math.round((SPOT0 + upside * 0.55) * 2) / 2;
    const balDays = days;
    // Patient: closer to ATM / slightly ITM-leaning OTM, longer tenor
    const patStrike = Math.round((SPOT0 + upside * 0.28) * 2) / 2;
    const patDays = Math.min(90, Math.round(days * 1.45));

    function premium(strike, d) {
      const otm = Math.max(0, strike - SPOT0);
      const time = Math.sqrt(d / 30);
      const extr = Math.max(0.35, 1.8 * time + upside * 0.04 - otm * 0.08);
      const intr = intrinsicAt(SPOT0, strike);
      return Math.round((intr + extr) * 100) / 100;
    }

    return [
      {
        id: 'agg',
        name: 'SPRINT CALL',
        strike: aggStrike,
        days: aggDays,
        premium: premium(aggStrike, aggDays),
        leverage: 'High torque',
        why: `Bets $${target.toFixed(0)} by day ${aggDays}. Cheap, snappy, decay bites fast.`,
      },
      {
        id: 'bal',
        name: 'THESIS CALL',
        strike: balStrike,
        days: balDays,
        premium: premium(balStrike, balDays),
        leverage: 'Matched leverage',
        why: `Built for your $${target.toFixed(0)} in ${balDays}d. Sweet-zone timing matters most.`,
      },
      {
        id: 'pat',
        name: 'PATIENT CALL',
        strike: patStrike,
        days: patDays,
        premium: premium(patStrike, patDays),
        leverage: 'Room to breathe',
        why: `Closer strike, ${patDays}d runway. Extrinsic lasts longer — still melts if you nap.`,
      },
    ];
  }

  // ─── Arcade ───
  function startArcade() {
    const contract = state.pick;
    const outcome = pickOutcome(state.rng); // schedule + optional smokeForce
    state.outcome = outcome;

    const entryExtrinsic = Math.max(0.05, contract.premium - intrinsicAt(SPOT0, contract.strike));
    const durationMs = 11000; // ~11s run — arcade pace

    // Precompute path samples
    const ctx = {
      spot0: SPOT0,
      strike: contract.strike,
      target: state.target,
      days: contract.days,
      tenorDays: contract.days,
    };
    const samples = [];
    const N = 240;
    for (let i = 0; i <= N; i++) {
      const t = i / N;
      const spot = outcome.build(t, ctx);
      const tLeft = 1 - t;
      const intr = intrinsicAt(spot, contract.strike);
      const extr = extrinsicAt(spot, contract.strike, tLeft, entryExtrinsic);
      const val = intr + extr;
      samples.push({ t, spot, intr, extr, val, pnl: val - contract.premium, pnlPct: (val - contract.premium) / contract.premium });
    }

    // Sweet zone: band where value is near peak of first 70% of path OR
    // where extrinsic still meaningful and pnl positive — mapped to progress t
    let peakIdx = 0;
    let peakVal = -Infinity;
    for (let i = 0; i < samples.length * 0.85; i++) {
      if (samples[i].val > peakVal) { peakVal = samples[i].val; peakIdx = i; }
    }
    // Also prefer zones where extr share is healthy
    let best = peakIdx;
    let bestScore = -Infinity;
    for (let i = Math.floor(samples.length * 0.15); i < Math.floor(samples.length * 0.8); i++) {
      const s = samples[i];
      const extrShare = s.val > 0 ? s.extr / s.val : 0;
      const score = s.pnlPct * 1.2 + extrShare * 0.35 + (1 - Math.abs(i - peakIdx) / samples.length);
      if (score > bestScore) { bestScore = score; best = i; }
    }
    const zoneCenter = samples[best].t;
    const zoneHalf = 0.09; // width of sweet zone in progress
    const zoneLo = clamp(zoneCenter - zoneHalf, 0.08, 0.85);
    const zoneHi = clamp(zoneCenter + zoneHalf, zoneLo + 0.1, 0.92);

    state.arcade = {
      contract,
      outcome,
      samples,
      entryExtrinsic,
      durationMs,
      t0: performance.now(),
      progress: 0,
      running: true,
      sold: false,
      zoneLo,
      zoneHi,
      raf: 0,
      lastSpot: SPOT0,
      lastIntr: 0,
      lastExtr: entryExtrinsic,
      lastVal: contract.premium,
      inZone: false,
    };
    state.phase = 'arcade';
    renderArcade();
    tickArcade();
  }

  function sampleAt(progress) {
    const samples = state.arcade.samples;
    const idx = clamp(progress, 0, 1) * (samples.length - 1);
    const i0 = Math.floor(idx);
    const i1 = Math.min(samples.length - 1, i0 + 1);
    const f = idx - i0;
    const a = samples[i0], b = samples[i1];
    return {
      t: progress,
      spot: a.spot + (b.spot - a.spot) * f,
      intr: a.intr + (b.intr - a.intr) * f,
      extr: a.extr + (b.extr - a.extr) * f,
      val: a.val + (b.val - a.val) * f,
      pnl: a.pnl + (b.pnl - a.pnl) * f,
      pnlPct: a.pnlPct + (b.pnlPct - a.pnlPct) * f,
    };
  }

  function renderArcade() {
    setSub('ARCADE · Hit SELL in the sweet zone');
    const c = state.arcade.contract;
    el.stage.innerHTML = `

  function drawArc(progress, samp) {
    const canvas = document.getElementById('arcCanvas');
    if (!canvas || !state.arcade) return;
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);

    const padX = 40, padY = 36;
    const a = state.arcade;

    // Arc path (quadratic)
    function xy(t) {
      const x = padX + t * (W - padX * 2);
      const y = H - padY - Math.sin(t * Math.PI) * (H - padY * 2 - 20);
      return [x, y];
    }

    // Track
    ctx.lineWidth = 10;
    ctx.strokeStyle = '#1e2a48';
    ctx.lineCap = 'round';
    ctx.beginPath();
    for (let i = 0; i <= 40; i++) {
      const [x, y] = xy(i / 40);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();

    // Sweet zone highlight on arc
    ctx.lineWidth = 14;
    ctx.strokeStyle = '#7b61ff99';
    ctx.shadowColor = '#7b61ff';
    ctx.shadowBlur = 12;
    ctx.beginPath();
    let started = false;
    for (let i = 0; i <= 60; i++) {
      const t = a.zoneLo + (a.zoneHi - a.zoneLo) * (i / 60);
      const [x, y] = xy(t);
      if (!started) { ctx.moveTo(x, y); started = true; }
      else ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.shadowBlur = 0;

    // Strike dashed horizontal feel via label
    ctx.fillStyle = '#8b97b8';
    ctx.font = '18px ui-monospace, monospace';
    ctx.fillText('K ' + a.contract.strike.toFixed(1), padX, 28);

    // Target tick
    const tFrac = clamp((state.target - 70) / 60, 0, 1); // decorative
    void tFrac;

    // Runner
    const [rx, ry] = xy(progress);
    ctx.beginPath();
    ctx.arc(rx, ry, 16, 0, Math.PI * 2);
    ctx.fillStyle = a.inZone ? '#00e5a8' : '#4cc9f0';
    ctx.shadowColor = a.inZone ? '#00e5a8' : '#4cc9f0';
    ctx.shadowBlur = 18;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#041018';
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('●', rx, ry);

    // Spot sparkline ghost along bottom of value
    ctx.textAlign = 'left';
    ctx.fillStyle = '#8b97b8';
    ctx.font = '16px ui-monospace, monospace';
    ctx.fillText(samp.spot.toFixed(2), rx + 20, ry - 8);
  }

  function tickArcade() {
    if (!state.arcade || !state.arcade.running) return;
    const a = state.arcade;
    const elapsed = performance.now() - a.t0;
    const progress = clamp(elapsed / a.durationMs, 0, 1);
    a.progress = progress;
    const samp = sampleAt(progress);
    a.lastSpot = samp.spot;
    a.lastIntr = samp.intr;
    a.lastExtr = samp.extr;
    a.lastVal = samp.val;
    a.inZone = progress >= a.zoneLo && progress <= a.zoneHi;

    // HUD
    const hudSpot = document.getElementById('hudSpot');
    const hudVal = document.getElementById('hudVal');
    const hudPnl = document.getElementById('hudPnl');
    const stackEx = document.getElementById('stackEx');
    const stackIn = document.getElementById('stackIn');
    const exAmt = document.getElementById('exAmt');
    const inAmt = document.getElementById('inAmt');
    const zoneChip = document.getElementById('zoneChip');
    const coach = document.getElementById('coach');

    if (hudSpot) {
      hudSpot.textContent = samp.spot.toFixed(2);
      hudSpot.style.color = samp.spot >= a.contract.strike ? 'var(--neon)' : 'var(--ink)';
    }
    if (hudVal) hudVal.textContent = money(samp.val);
    if (hudPnl) {
      hudPnl.textContent = money(samp.pnl);
      hudPnl.style.color = samp.pnl >= 0 ? 'var(--neon)' : 'var(--hot)';
    }

    const total = Math.max(0.01, samp.intr + samp.extr);
    const exW = (samp.extr / total) * 100;
    const inW = (samp.intr / total) * 100;
    if (stackEx) stackEx.style.width = exW + '%';
    if (stackIn) stackIn.style.width = inW + '%';
    if (exAmt) exAmt.textContent = money(samp.extr);
    if (inAmt) inAmt.textContent = money(samp.intr);

    if (zoneChip) {
      zoneChip.className = 'zone-chip' + (a.inZone ? ' hot' : '');
      zoneChip.textContent = a.inZone ? 'IN THE ZONE — SELL!' : 'SWEET ZONE';
    }
    if (coach) {
      if (a.inZone) {
        coach.className = 'coach alert';
        coach.textContent = 'Apex window! Extrinsic still alive — hit SELL.';
      } else if (progress < a.zoneLo) {
        coach.className = 'coach';
        coach.textContent = 'Building… gold (extrinsic) is still fat. Wait for the band.';
      } else {
        coach.className = 'coach alert';
        coach.textContent = 'Past the zone — time is eating extrinsic.';
      }
    }

    drawArc(progress, samp);

    if (progress >= 1) {
      // Auto-expire = forced late sell
      finishSell(samp, false, true);
      return;
    }
    a.raf = requestAnimationFrame(tickArcade);
  }

  function sellNow() {
    if (!state.arcade || !state.arcade.running || state.arcade.sold) return;
    const samp = sampleAt(state.arcade.progress);
    finishSell(samp, state.arcade.inZone, false);
  }

  function finishSell(samp, inZone, expired) {
    const a = state.arcade;
    if (!a || a.sold) return;
    a.sold = true;
    a.running = false;
    if (a.raf) cancelAnimationFrame(a.raf);

    const contract = a.contract;
    const pnl = samp.pnl;
    const pnlPct = samp.pnlPct;
    const rare = a.outcome.tier === 'rare';
    let grade, title, lesson;

    if (expired) {
      grade = 'lose';
      title = 'EXPIRED';
      lesson = `You never sold. <strong>Extrinsic melted to ${money(samp.extr)}</strong> while you waited. Flat-ish price still kills options — timing is the skill.`;
    } else if (inZone && rare && pnlPct > 0.5) {
      grade = 'rare';
      title = 'JACKPOT CRUSH';
      lesson = `Rare path + sweet-zone sell. You kept <strong>extrinsic ${money(samp.extr)}</strong> and banked <strong>intrinsic ${money(samp.intr)}</strong>. Casino-scarce — savor it.`;
    } else if (inZone) {
      grade = 'win';
      title = 'SWEET ZONE';
      lesson = `Nailed the apex. Sold with extrinsic still alive (${money(samp.extr)}) and intrinsic ${money(samp.intr)}. <strong>This</strong> is the skill — not picking the “right” strike.`;
    } else if (a.progress < a.zoneLo) {
      grade = pnl >= 0 ? 'ok' : 'lose';
      title = 'EARLY EXIT';
      lesson = `Out before the band. Thesis barely played. Extrinsic was still fat (${money(samp.extr)}) — sometimes patience into the zone pays.`;
    } else {
      // Late
      grade = pnlPct > -0.15 ? 'ok' : 'lose';
      title = 'LATE SELL';
      lesson = `Past the sweet zone. <strong>Time decay</strong> chewed extrinsic down to ${money(samp.extr)}. Spot was ${samp.spot.toFixed(2)} — even a flat tape punishes late hands.`;
    }

    state.result = {
      grade, title, lesson, samp, inZone, expired, rare,
      outcomeLabel: a.outcome.label,
      outcomeId: a.outcome.id,
      tier: a.outcome.tier,
      contract,
      pnl, pnlPct,
    };
    state.phase = 'result';
    render();
  }

  function renderResult() {
    const r = state.result;
    setSub('Result · Intrinsic vs Extrinsic');
    el.stage.innerHTML = `
      <div class="panel stamp">
        <div class="grade ${r.grade}">${r.title}</div>
        <div class="detail">${r.outcomeLabel} · sold @ spot ${r.samp.spot.toFixed(2)}</div>
        <div class="iv-split">
          <div class="cell">
            <div class="n">Extrinsic</div>
            <div class="x" style="color:var(--extrinsic)">${money(r.samp.extr)}</div>
          </div>
          <div class="cell">
            <div class="n">Intrinsic</div>
            <div class="x" style="color:var(--intrinsic)">${money(r.samp.intr)}</div>
          </div>
        </div>
        <div class="iv-split">
          <div class="cell">
            <div class="n">Option P/L</div>
            <div class="x" style="color:${r.pnl >= 0 ? 'var(--neon)' : 'var(--hot)'}">${money(r.pnl)} (${pct(r.pnlPct)})</div>
          </div>
          <div class="cell">
            <div class="n">Contract</div>
            <div class="x" style="font-size:14px">${r.contract.strike.toFixed(1)}C · ${r.contract.days}d</div>
          </div>
        </div>
        <div class="lesson">${r.lesson}</div>
      </div>
      <div class="flex-grow"></div>
      <div class="btn-row">
        <button class="btn btn-ghost" id="btnAgain" type="button">SAME THESIS</button>
        <button class="btn btn-neon" id="btnNew" type="button">NEW THEORY</button>
      </div>
    `;
    document.getElementById('btnAgain').onclick = () => {
      // Re-roll outcome, same contract
      state.rng = mulberry32((daySeed() ^ Date.now()) >>> 0);
      startArcade();
    };
    document.getElementById('btnNew').onclick = () => {
      state.phase = 'where';
      state.pick = null;
      state.result = null;
      state.arcade = null;
      render();
    };
  }

  // ─── Smoke API ───
  window.__strikeSonySmoke = {
    get() {
      return {
        phase: state.phase,
        target: state.target,
        days: state.days,
        structures: state.structures.map((s) => ({ id: s.id, strike: s.strike, days: s.days, premium: s.premium, name: s.name })),
        pick: state.pick ? { id: state.pick.id, strike: state.pick.strike, days: state.pick.days } : null,
        outcome: state.outcome ? { id: state.outcome.id, tier: state.outcome.tier, label: state.outcome.label } : null,
        arcade: state.arcade ? {
          progress: state.arcade.progress,
          zoneLo: state.arcade.zoneLo,
          zoneHi: state.arcade.zoneHi,
          inZone: state.arcade.inZone,
          running: state.arcade.running,
          sold: state.arcade.sold,
          spot: state.arcade.lastSpot,
          extr: state.arcade.lastExtr,
          intr: state.arcade.lastIntr,
          val: state.arcade.lastVal,
        } : null,
        result: state.result ? {
          grade: state.result.grade,
          title: state.result.title,
          inZone: state.result.inZone,
          expired: state.result.expired,
          rare: state.result.rare,
          outcomeId: state.result.outcomeId,
          tier: state.result.tier,
          pnl: state.result.pnl,
          extr: state.result.samp.extr,
          intr: state.result.samp.intr,
        } : null,
        outcomes: OUTCOMES.map((o) => ({ id: o.id, tier: o.tier, weight: o.weight })),
        spot0: SPOT0,
        ref: REF,
        bodyText: document.body.innerText,
      };
    },
    setTarget(v) { state.target = clamp(Math.round(v), MIN_TARGET, MAX_TARGET); },
    setDays(v) { state.days = v; },
    goto(phase) { state.phase = phase; render(); },
    forceOutcome(id) { state.smokeForceOutcome = id; },
    clearForce() { state.smokeForceOutcome = null; },
    pickStructure(id) {
      state.pick = state.structures.find((s) => s.id === id) || state.structures[0];
    },
    lockAndStart() {
      if (!state.pick && state.structures.length) state.pick = state.structures[1] || state.structures[0];
      startArcade();
    },
    sell() { sellNow(); },
    // Advance arcade clock artificially for tests
    setProgress(p) {
      if (!state.arcade) return;
      state.arcade.t0 = performance.now() - clamp(p, 0, 1) * state.arcade.durationMs;
    },
    rebuildStructures() {
      state.structures = buildStructures(state.target, state.days);
    },
    getCrushSchedule() { return getCrushSchedule(); },
    resetCrushSchedule() { resetCrushSchedule(); },
    gapForCrushHits(h) { return gapForCrushHits(h); },
    simulateCrushSchedule(n, seed) { return simulateCrushSchedule(n, seed); },
    GAP_SEQ: GAP_SEQ.slice(),
    RESIDUAL_RARE,
  };

  // Boot
  const params = new URLSearchParams(location.search);
  if (params.get('seed')) {
    state.rng = mulberry32(Number(params.get('seed')) || 1);
  }
  render();
})();
</script>
</body>
